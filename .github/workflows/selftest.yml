name: selftest
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Git identity (the kit commits inside its temp classroom)
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Install the skills
        run: ./install.sh
      - name: Kit self-test
        run: python3 .claude/skills/kickoff/tests/selftest.py
